<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<script>window.STANDALONE=true;</script>
<title>Tartanga Egutegia 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Tartanga brand (Markaren eskuliburua): corporate navy + yellow, teal as support; Montserrat for titles (H1-H3), Roboto for text.
   Layout: white brand band with the corporate logo, course switcher, 10-month wall calendar, key-dates list below. */
:root{
  --navy:#102B44; --yellow:#FFF33E; --teal:#00AE8F;
  --bg:#f4f6f8; --paper:#ffffff; --band:#ffffff; --ink:#102B44; --muted:#56677a; --line:#d8dee6;
  --sel-bg:#102B44; --sel-ink:#ffffff; --hi:#FFF33E; --hi-ink:#102B44; --teal-ink:#007a65;
  --hol:#d7443a; --hol-bg:#fde3e0; --off:#4f6680; --off-bg:#e2e8ef;
  --exam:#6a4cc0; --exam-bg:#ebe5fb; --work:#007a65; --work-bg:#cdeee7;
  --mark:#00AE8F; --weekend:#eef1f4; --today:#102B44;
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Roboto",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1d2e; --paper:#12273c; --band:#102B44; --ink:#e8eef5; --muted:#9fb0c3; --line:#26405a;
  --sel-bg:#FFF33E; --sel-ink:#102B44; --hi:#FFF33E; --hi-ink:#102B44; --teal-ink:#3fd3b6;
  --hol:#ff8f84; --hol-bg:#4a2228; --off:#b3c3d6; --off-bg:#283f57;
  --exam:#b9a5ff; --exam-bg:#33295a; --work:#3fd3b6; --work-bg:#0f4a45;
  --mark:#3fd3b6; --weekend:#0f2236; --today:#FFF33E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1d2e; --paper:#12273c; --band:#102B44; --ink:#e8eef5; --muted:#9fb0c3; --line:#26405a;
  --sel-bg:#FFF33E; --sel-ink:#102B44; --hi:#FFF33E; --hi-ink:#102B44; --teal-ink:#3fd3b6;
  --hol:#ff8f84; --hol-bg:#4a2228; --off:#b3c3d6; --off-bg:#283f57;
  --exam:#b9a5ff; --exam-bg:#33295a; --work:#3fd3b6; --work-bg:#0f4a45;
  --mark:#3fd3b6; --weekend:#0f2236; --today:#FFF33E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.inner{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-block:8px 48px}

/* brand band */
.band{background:var(--band);border-bottom:6px solid var(--yellow);position:relative;overflow:hidden}
.band .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band .deco line{stroke-width:1.2;stroke-dasharray:7 6;fill:none}
.band .deco .l1{stroke:var(--teal);opacity:.55} .band .deco .l2{stroke:var(--yellow);opacity:.9}
.band .inner{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px;padding-block:22px 20px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;min-width:0}
.logo{display:block;width:clamp(170px,22vw,230px);height:auto}
.logo-neg{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-cor{display:none}:root:not([data-theme="light"]) .logo-neg{display:block}}
:root[data-theme="dark"] .logo-cor{display:none} :root[data-theme="dark"] .logo-neg{display:block}
.titlebox{border-left:2px solid var(--line);padding-left:24px;min-width:0}
@media (max-width:640px){.titlebox{border-left:0;padding-left:0}}
h1{font:800 clamp(24px,3.6vw,36px)/1.08 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .yr{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .25em;margin-left:.1em}
.sub{font:500 13px var(--f-display);color:var(--muted);margin-top:6px;letter-spacing:.02em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;color:var(--ink);font:700 12px var(--f-display);padding:8px 13px;cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-display);padding:8px 13px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.picker{margin-top:22px;display:grid;gap:12px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.group h2{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;min-width:170px}
@media (max-width:640px){.group h2{flex-basis:100%}}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 13px;font:600 13.5px var(--f-display);cursor:pointer;text-align:left;box-shadow:inset 0 -3px 0 transparent}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink);box-shadow:inset 0 -3px 0 var(--teal)}

.course{margin-top:26px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.course .ct{display:grid;gap:4px;min-width:0;flex:1 1 380px}
.course h3{font:700 clamp(20px,3vw,26px)/1.15 var(--f-display);margin:0;text-wrap:balance}
.course p{margin:0;color:var(--muted);max-width:70ch}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 0 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.sw.hol{background:var(--hol-bg);border-color:var(--hol)}
.sw.off{background:var(--off-bg);border-color:var(--off)}
.sw.exam{background:var(--exam-bg);border-color:var(--exam)}
.sw.work{background:repeating-linear-gradient(135deg,var(--work-bg) 0 4px,var(--paper) 4px 7px);border-color:var(--work)}
.sw.mark{background:var(--paper);position:relative}
.sw.mark::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--mark)}
.sw.start{background:var(--hi);border-color:var(--navy)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:14px}
.mwrap{container-type:inline-size;min-width:0}
.months{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:440px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:720px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:1060px){.months{grid-template-columns:repeat(5,minmax(0,1fr))}}
.month{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 10px 8px;overflow:hidden}
.month h4{margin:0 -10px 8px;padding:8px 10px;font:700 14px var(--f-display);display:flex;justify-content:space-between;gap:8px;background:var(--sel-bg);color:var(--sel-ink);text-transform:uppercase;letter-spacing:.05em}
.month h4 small{font:500 12px var(--f-body);opacity:.8;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-variant-numeric:tabular-nums}
.dow{font:700 10px var(--f-display);text-align:center;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.d{position:relative;aspect-ratio:1/1;max-width:100%;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:4px;cursor:default;border:1px solid transparent}
.d.we{background:var(--weekend);color:var(--muted)}
.d.out{opacity:.38}
.d.hol{background:var(--hol-bg);color:var(--hol);font-weight:700;border-color:var(--hol)}
.d.off{background:var(--off-bg);color:var(--off);font-weight:700;border-color:var(--off)}
.d.work{background:repeating-linear-gradient(135deg,var(--work-bg) 0 4px,transparent 4px 7px);color:var(--work);font-weight:700}
.d.exam{background:var(--exam-bg);color:var(--exam);font-weight:700;border-color:var(--exam)}
.d.start{background:var(--hi);color:var(--hi-ink);font-weight:800;border-color:var(--navy)}
.d.mk::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--mark)}
.d.start.mk::after{background:var(--navy)}
.d.today{box-shadow:inset 0 0 0 2px var(--today)}
.d[data-tip]{cursor:help}

aside.agenda{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:4px;padding:16px 18px}
.agenda-cols{container-type:inline-size}
@container (min-width:720px){ol.ev{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}}
.agenda h3{font:700 18px var(--f-display);margin:0 0 8px}
.next{background:var(--navy);color:#ffffff;border-radius:4px;padding:12px 16px;min-width:250px;border-left:6px solid var(--yellow)}
.next .k{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--yellow)}
.next .t{font:700 16px var(--f-display);margin-top:3px}
.next .w{color:#c9d5e2;font-size:13px}
:root[data-theme="dark"] .next{background:var(--paper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .next{background:var(--paper)}}
ol.ev{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol.ev li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
ol.ev li.past{opacity:.5}
ol.ev .when{font:700 13px var(--f-display);font-variant-numeric:tabular-nums}
ol.ev .what{display:flex;gap:8px;align-items:flex-start}
ol.ev .what i{flex:none;width:10px;height:10px;border-radius:3px;margin-top:5px}
i.c-start{background:var(--hi);border:1px solid var(--navy)} i.c-mark{background:var(--mark);border-radius:50%!important}
i.c-exam{background:var(--exam)} i.c-work{background:var(--work)} i.c-hol{background:var(--hol)} i.c-off{background:var(--off)}
.icsbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.icsbar a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 13px var(--f-display);color:var(--ink);text-decoration:none;background:var(--paper)}
.icsbar a:hover{border-color:var(--ink)}
.icsbar a::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal)}
html.embedded .band .inner{padding-block:12px 10px}
html.embedded .sub,html.embedded .band .deco{display:none}
html.embedded .logo{width:150px}
.foot{margin-top:28px;color:var(--muted);font-size:13px;max-width:80ch}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--navy);color:#ffffff;border-left:3px solid var(--yellow);font-size:13px;padding:6px 9px;border-radius:4px;max-width:240px}
.toast{margin-left:4px;font-size:13px;color:var(--teal-ink)}
</style>
</head>
<body>

<style>
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:18px 0 6px}
.tabs button{border:0;background:none;color:var(--muted);font:700 14px var(--f-display);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
html.embedded .tabs{display:none}
.draft{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--hol-bg);border:1px solid var(--hol);border-radius:6px;padding:10px 14px;margin-top:14px;font-size:14px}
.draft strong{font-family:var(--f-display)}
.abtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-display);padding:8px 13px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.abtn:hover{border-color:var(--ink)}
.abtn.primary{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.abtn.ghost{border-color:transparent;background:none}
.abtn.danger{color:var(--hol)}
.abtn.sm{padding:5px 9px;font-size:12px}
.adm h2{font:700 20px var(--f-display);margin:18px 0 4px}
.adm h3{font:700 16px var(--f-display);margin:0}
.adm .hint{color:var(--muted);margin:4px 0 12px;max-width:80ch;font-size:14px}
.acard{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:14px}
.adm input[type=text],.adm input[type=date],.adm select,.adm textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 7px}
.adm textarea{width:100%;min-height:52px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
.toast2{font-size:13px;color:var(--teal-ink)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.drun{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.drun .dt{font:700 13px var(--f-display);min-width:150px}
.drun .lab{color:var(--muted);flex:1 1 160px}
.drun .tag{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.tag.hol{background:var(--hol-bg);color:var(--hol)} .tag.off{background:var(--off-bg);color:var(--off)}
.chead{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
.chead label{display:grid;gap:3px;font:600 12px var(--f-display);color:var(--muted)}
details.cdet>summary{list-style:none;cursor:pointer}
details.cdet>summary::-webkit-details-marker{display:none}
details.cdet>summary h3::before{content:"▸";color:var(--teal);margin-right:2px}
details.cdet[open]>summary h3::before{content:"▾"}
.cbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cbar h3{display:flex;gap:10px;align-items:center}
.cbar .code{font:700 12px var(--f-display);background:var(--weekend);border-radius:4px;padding:2px 7px;color:var(--muted)}
.etable{width:100%;border-collapse:collapse;margin-top:6px}
.etable th{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.etable td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.etable select{max-width:100%}
.scroll{overflow-x:auto;max-width:100%}
.bad{color:var(--hol);font-size:12px;display:block}
details.acard summary{cursor:pointer;font:700 14px var(--f-display)}
#jsonout{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-top:10px}
.icsbar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--f-display);padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.icsbar button::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal)}
.icsbar button:hover{border-color:var(--ink)}
.print-head{display:none}
.sess-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin:18px 0 4px}
.sess-top .chips{display:flex;flex-wrap:wrap;gap:8px}
.sfind{display:grid;gap:4px;font:600 12px var(--f-display);color:var(--muted)}
.sfind input{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:220px;max-width:100%}
.sday h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sday h3 small{font:500 13px var(--f-body);color:var(--muted)}
.stable{border-collapse:collapse;width:100%;margin-top:8px}
.stable th,.stable td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:center}
.stable th{font:700 10.5px var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--weekend)}
.stable td.hr{font:700 14px var(--f-display);white-space:nowrap;background:var(--weekend);width:1%}
.gp{display:inline-block;font:700 13px var(--f-display);background:var(--sel-bg);color:var(--sel-ink);border-radius:4px;padding:3px 7px;margin:2px;white-space:nowrap}
.searching .gp{opacity:.25}
.searching .gp.hit{opacity:1;background:var(--hi);color:var(--hi-ink);outline:2px solid var(--navy)}
.mine h3{margin-bottom:6px}
.mine ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px}
.mine li{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.mine li b{font-family:var(--f-display);min-width:5.5em}
.mine li.past{opacity:.5}
.empty{color:var(--muted);font-size:14px}
.pl-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.pl-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1100px){.pl-wrap{grid-template-columns:minmax(0,1fr) 260px}}
.pl-side{display:flex;flex-direction:column;gap:12px}
.pl-side>*{flex:none}
@media (min-width:1100px){.pl-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow:auto}}
.tray{border:2px dashed var(--line);border-radius:8px;padding:10px;min-height:80px;background:var(--bg)}
.tray.over{border-color:var(--teal)}
.tray h4,.warn h4{font:700 12px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.tray .lv{font:700 11px var(--f-display);color:var(--muted);margin:8px 0 4px}
.pc{display:inline-flex;align-items:center;gap:3px;font:700 12px var(--f-display);background:var(--sel-bg);color:var(--sel-ink);border-radius:4px;padding:3px 4px 3px 7px;margin:2px;cursor:grab;user-select:none;border:2px solid transparent;white-space:nowrap}
.pc.tr{background:var(--paper);color:var(--ink);border-color:var(--line);padding-right:7px}
.pc .x{border:0;background:none;color:inherit;opacity:.7;cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.pc.sel{outline:3px solid var(--teal);outline-offset:1px}
.pc.bad{border-color:var(--hol)}
.pc small{font:500 10px var(--f-body);opacity:.75}
.pgrid{border-collapse:collapse;width:100%}
.pgrid th,.pgrid td{border:1px solid var(--line);padding:4px;vertical-align:top;text-align:center}
.pgrid th{font:700 9.5px var(--f-display);text-transform:uppercase;color:var(--muted);background:var(--weekend);min-width:66px}
.pgrid td.hr{background:var(--weekend);font:700 13px var(--f-display);white-space:nowrap}
.pgrid td.cell{min-width:66px;height:36px;cursor:pointer}
.pgrid td.cell.over,.armed .pgrid td.cell:hover{background:var(--accent-soft,rgba(0,174,143,.12));outline:2px dashed var(--teal);outline-offset:-3px}
.pday{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px;background:var(--paper)}
.pday-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.pday-h strong{font:700 15px var(--f-display);margin-right:6px}
.warn{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
.warn ul{margin:0;padding-left:18px;font-size:13px}
.warn li{margin:2px 0}
.selbar{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.gtable td,.gtable th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.gtable th{font:700 11px var(--f-display);text-transform:uppercase;color:var(--muted)}
.sess-ev summary{cursor:pointer;font:700 14px var(--f-display);padding:6px 0}
.sess-ev table{width:100%;border-collapse:collapse}
.sess-ev td,.sess-ev th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.sess-ev th{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess-ev input[type=text]{width:100%;min-width:110px}
.htable{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.htable th,.htable td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
.htable th{font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.htable th.l,.htable td.l{text-align:left}
.htable td.res{font:700 16px var(--f-display)}
.htable td.tot{font:800 17px var(--f-display);background:var(--hi);color:var(--hi-ink)}
.htable th.grp{color:var(--ink);border-bottom:2px solid var(--ink)}
.htable input[type=number]{width:3.6em;text-align:center}
.htable input.name{width:100%;min-width:140px}
.htable .note{display:block;font:500 11px var(--f-body);color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px}
.hpick{margin:18px 0 4px}
.hpick .chip{font-size:13px}
@page{size:A4 portrait;margin:9mm}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#ffffff; --paper:#ffffff; --band:#ffffff; --ink:#102B44; --muted:#56677a; --line:#cfd6df;
    --sel-bg:#102B44; --sel-ink:#ffffff; --hi:#FFF33E; --hi-ink:#102B44; --teal-ink:#007a65;
    --hol:#d7443a; --hol-bg:#fde3e0; --off:#4f6680; --off-bg:#e2e8ef;
    --exam:#6a4cc0; --exam-bg:#ebe5fb; --work:#007a65; --work-bg:#cdeee7;
    --mark:#00AE8F; --weekend:#eef1f4; --today:#102B44; color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:10px;background:#fff}
  .tools,.picker,.tabs,.draft,.icsbar,#tip,.next,.band .deco,.noprint,.sub,.foot{display:none!important}
  .logo-cor{display:block!important}.logo-neg{display:none!important}
  .band{border-bottom-width:4px}
  .band .inner{padding-block:0 6px!important;padding-inline:0}
  .logo{width:120px!important}
  h1{font-size:18px}
  .titlebox{padding-left:14px}
  .inner{max-width:none;padding-left:0!important;padding-right:0!important}
  .wrap{padding-block:6px 0}
  .course{margin-top:6px}
  .course h3{font-size:15px}.course p{font-size:10px}
  .legend{margin:4px 0;font-size:9px;gap:4px 10px}.sw{width:11px;height:11px}
  .layout{gap:8px;margin-top:4px}
  .mwrap{container-type:normal}
  .months{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:5px!important}
  .month{padding:0 4px 3px;break-inside:avoid}
  .month h4{font-size:9px;padding:3px 5px;margin:0 -4px 3px}
  .month h4 small{font-size:8px}
  .dow{font-size:7px;padding:0}
  .grid{gap:1px}
  .d{font-size:8px;border-radius:2px}
  .d.mk::after{width:3px;height:3px;bottom:1px;margin-left:-1.5px}
  .d.today{box-shadow:none}
  aside.agenda{padding:6px 8px;border-radius:3px;break-inside:avoid}
  .agenda h3{font-size:11px;margin:0 0 2px}
  ol.ev{grid-template-columns:repeat(3,minmax(0,1fr))!important;column-gap:14px!important}
  ol.ev li{grid-template-columns:62px minmax(0,1fr);gap:5px;padding:2px 0;font-size:8.5px}
  ol.ev li.past{opacity:1}
  ol.ev .when{font-size:8.5px}
  ol.ev .what i{width:7px;height:7px;margin-top:2px}
  .print-head{display:block;font:700 15px var(--f-display);margin:2px 0 8px}
  .acard{border-color:var(--line);break-inside:avoid;padding:8px 10px;margin-top:8px}
  .htable th,.htable td{padding:4px 5px}
  .htable input{border:0!important;background:none!important;padding:0!important;font-weight:700}
  .htable td.res{font-size:12px}.htable td.tot{font-size:13px}
  .htable button{display:none}
  .scroll{overflow:visible}
  .htable{font-size:9px}.htable th{font-size:7.5px}
  .htable input.name{min-width:0;width:100%}
  .htable input[type=number]{width:2.4em;-moz-appearance:textfield;appearance:textfield}
  .htable input::-webkit-inner-spin-button,.htable input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .htable .note{font-size:7px}
  .adm .hint{font-size:9px;margin:2px 0 6px}
  .stable th,.stable td{padding:3px}.stable th{font-size:7px}.stable td.hr{font-size:10px}
  .gp{font-size:9px;padding:1px 4px;margin:1px}
  .sday{break-inside:avoid}.sday h3{font-size:12px}
  .searching .gp{opacity:1}
}

function fmt(s){const t=T[lang],d=P(s);return lang==="es"?`${d.getDate()} ${t.mshort[d.getMonth()]}`:`${t.mshort[d.getMonth()]}. ${d.getDate()}`;}
function fmtRange(a,b){
  if(!b||b===a) return fmt(a);
  const A=P(a),B=P(b);
  if(A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear()) return lang==="es"?`${A.getDate()}–${B.getDate()} ${T.es.mshort[A.getMonth()]}`:`${T.eu.mshort[A.getMonth()]}. ${A.getDate()}–${B.getDate()}`;
  return fmt(a)+" – "+fmt(b);
}
const evLabel=(e,l=lang)=>e.k==="custom"?((e.label&&(e.label[l]||e.label.es||e.label.eu))||"—"):E[e.k][l];
const cStart=c=>{const s=c.events.find(e=>e.k==="start");return s?s.from:(c.events.map(e=>e.from).sort()[0]||"9999");};
const cEnd=c=>c.events.map(e=>e.to||e.from).sort().pop()||"0000";
const dayMap=()=>{const m={};cfg.days.forEach(x=>m[x.d]=x);return m;};

/* core rule: is d a no-class day for course c? returns "hol" | "off" | null */
function noClass(c,d,DM){
  const x=DM[d]; if(!x) return null;
  if(x.t==="hol") return "hol";
  const inFE=c.events.some(e=>e.k==="fe"&&e.from<=d&&d<=(e.to||e.from));
  return inFE?null:"off";
}

/* ---------- public calendar ---------- */
function buildMap(c){
  const DM=dayMap(), m={}, s=cStart(c), end=cEnd(c);
  const put=(d,cls,label)=>{(m[d]=m[d]||{cls:new Set(),lab:[]}); if(cls) m[d].cls.add(cls); if(label) m[d].lab.push(label);};
  cfg.days.forEach(x=>{const t=noClass(c,x.d,DM); if(t) put(x.d,t,(x.label&&(x.label[lang]||x.label.es))||T[lang].L[t]);});
  c.events.forEach(e=>{
    const ty=TYPE(e.k), lab=evLabel(e);
    if(e.to&&e.to!==e.from){
      for(let d=e.from; d<=e.to; d=addD(d,1)){
        if(wd(d)>4||(m[d]&&(m[d].cls.has("hol")||m[d].cls.has("off")))) continue;
        if(ty==="work"&&m[d]&&m[d].cls.has("exam")) continue;
        put(d, ty==="mark"?"mk":ty, lab);
      }
    } else put(e.from, ty==="start"?"start":"mk", lab);
  });
  return m;
}
/* consecutive runs of no-class days (weekends bridged) for one course */
function breakRuns(c){
  const DM=dayMap(), s=cStart(c), out=[];
  const e=cEnd(c), ds=cfg.days.map(x=>x.d).sort().filter(d=>d>=s&&d<=e&&noClass(c,d,DM));
  ds.forEach(d=>{
    const x=DM[d], t=noClass(c,d,DM), key=x.label?("L:"+x.label.es):("T:"+t), last=out[out.length-1];
    let bridge=false;
    if(last&&last.key===key){let g=addD(last.b,1);bridge=true;while(g<d){if(wd(g)<5){bridge=false;break;}g=addD(g,1);}}
    if(bridge) last.b=d; else out.push({a:d,b:d,key,t,label:x.label});
  });
  return out;
}

function renderCal(){
  const t=T[lang];
  if(!cfg.courses.length){document.getElementById("months").innerHTML="";return;}
  if(!cur||!cfg.courses.includes(cur)){const h=decodeURIComponent((location.hash||"").slice(1));cur=cfg.courses.find(c=>c.id===h)||cfg.courses[0];}
  document.title=(lang==="es"?"Calendario ":"Egutegia ")+cur.name[lang]+" · Tartanga "+(cfg.year||"");
  const pk=document.getElementById("picker"); pk.innerHTML="";
  [1,2,3].forEach(g=>{
    const list=cfg.courses.filter(c=>Number(c.g)===g); if(!list.length) return;
    const row=document.createElement("div"); row.className="group"; row.innerHTML=`<h2>${t["g"+g]}</h2>`;
    list.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c.name[lang]||c.name.es;b.setAttribute("aria-pressed",c===cur);
      b.onclick=()=>{cur=c;try{history.replaceState(null,"","#"+c.id)}catch(e){};renderCal();};row.appendChild(b);});
    pk.appendChild(row);
  });
  document.getElementById("cname").textContent=cur.name[lang]||cur.name.es;
  document.getElementById("cdesc").textContent=(cur.desc&&(cur.desc[lang]||cur.desc.es))||"";
  document.getElementById("legend").innerHTML=["start","hol","off","exam","work","mark"].map(k=>`<span><i class="sw ${k}"></i>${t.L[k]}</span>`).join("");

  const map=buildMap(cur), td=iso(today()), y0=yearStart(), st=cStart(cur);
  const box=document.getElementById("months"); box.innerHTML="";
  for(let i=0;i<10;i++){
    const y=i<4?y0:y0+1, mo=(8+i)%12, first=new Date(y,mo,1), nd=new Date(y,mo+1,0).getDate(), cells=[];
    for(let k=0;k<(first.getDay()+6)%7;k++) cells.push(`<span></span>`);
    for(let d=1;d<=nd;d++){
      const s=iso(new Date(y,mo,d)), info=map[s], cls=["d"]; let tip=[];
      if(wd(s)>4) cls.push("we");
      if(info){cls.push(...info.cls);tip=info.lab;}
      if(s<st) cls.push("out");
      if(s===td){cls.push("today");tip=[t.today,...tip];}
      cells.push(`<span class="${cls.join(" ")}"${tip.length?` data-tip="${esc(tip.join(" · "))}" tabindex="0"`:""}>${d}</span>`);
    }
    const el=document.createElement("section"); el.className="month";
    el.innerHTML=`<h4>${t.months[mo]} <small>${y}</small></h4><div class="grid">${t.dow.map(x=>`<span class="dow">${x}</span>`).join("")}${cells.join("")}</div>`;
    box.appendChild(el);
  }
  const items=cur.events.map(e=>({a:e.from,b:e.to,lab:evLabel(e),t:TYPE(e.k)}))
    .concat(breakRuns(cur).map(r=>({a:r.a,b:r.b,lab:r.label?(r.label[lang]||r.label.es):t.L[r.t],t:r.t})))
    .sort((x,y)=>x.a<y.a?-1:x.a>y.a?1:0);
  document.getElementById("events").innerHTML=items.map(it=>`<li class="${(it.b||it.a)<td?"past":""}"><span class="when">${fmtRange(it.a,it.b)}</span><span class="what"><i class="c-${it.t}"></i><span>${esc(it.lab)}</span></span></li>`).join("");
  const nx=items.find(it=>(it.b||it.a)>=td&&it.t!=="hol"&&it.t!=="off")||items.find(it=>(it.b||it.a)>=td), nb=document.getElementById("next");
  if(nx){const diff=Math.round((P(nx.a)-today())/86400000);
    let w=diff<=0?t.isToday:diff===1?t.tomorrow:(lang==="es"?`${t.in} ${diff} ${t.days}`:`${diff} ${t.days}`);
    if(nx.b&&diff<=0) w=t.running;
    nb.innerHTML=`<div class="k">${t.next}</div><div class="t">${esc(nx.lab)}</div><div class="w">${fmtRange(nx.a,nx.b)} · ${w}</div>`;}
  else nb.innerHTML=`<div class="t">${t.over}</div>`;
  const ib=document.getElementById("icsbar");
  if(window.STANDALONE){ib.innerHTML=`<button type="button" id="ics-c">${t.ics}</button><button type="button" id="ics-all">${t.icsAll}</button>`;ib.hidden=false;
    document.getElementById("ics-c").onclick=()=>save(`tartanga-${cfg.year}-${cur.id}.ics`,icsCourse(cur),"text/calendar");
    document.getElementById("ics-all").onclick=()=>save(`tartanga-${cfg.year}-orokorra-general.ics`,icsAll(),"text/calendar");}
}

/* ---------- ICS ---------- */
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function fold(line){const enc=new TextEncoder(),out=[];let cur="",n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>(out.length?74:75)){out.push(cur);cur="";n=0;}cur+=ch;n+=b;}out.push(cur);return out.join("\r\n ");}
function ical(name,evs){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CIFP Tartanga LHII//Egutegia//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",fold("X-WR-CALNAME:"+icsEsc(name)),"X-WR-TIMEZONE:Europe/Madrid"];
  evs.forEach((e,i)=>{L.push("BEGIN:VEVENT",`UID:tartanga-${cfg.year}-${e.uid||i}-${e.a.replace(/-/g,"")}@tartanga`,"DTSTAMP:"+stamp,
    "DTSTART;VALUE=DATE:"+e.a.replace(/-/g,""),"DTEND;VALUE=DATE:"+addD(e.b||e.a,1).replace(/-/g,""),fold("SUMMARY:"+icsEsc(e.s)));
    if(e.desc) L.push(fold("DESCRIPTION:"+icsEsc(e.desc))); if(e.cat) L.push(fold("CATEGORIES:"+icsEsc(e.cat)));
    L.push("TRANSP:TRANSPARENT","END:VEVENT");});
  L.push("END:VCALENDAR"); return L.join("\r\n")+"\r\n";
}
const bil=(es,eu)=>`${eu} / ${es}`;
function icsCourse(c){
  const evs=c.events.map((e,i)=>({uid:c.id+"-e"+i,a:e.from,b:e.to,s:bil(evLabel(e,"es"),evLabel(e,"eu"))}))
    .concat(breakRuns(c).map((r,i)=>({uid:c.id+"-h"+i,a:r.a,b:r.b,s:r.label?bil(r.label.es||r.label.eu,r.label.eu||r.label.es):bil(T.es.L[r.t],T.eu.L[r.t])})));
  evs.sort((x,y)=>x.a<y.a?-1:1);
  return ical(`Tartanga ${cfg.year} · ${c.name.eu} / ${c.name.es}`,evs);
}
function icsAll(){
  const order=cfg.courses.map(c=>c.id), DM=dayMap(), items=[];
  const who=ids=>ids.length===order.length?{es:"Todos los cursos",eu:"Ikastaro guztiak",pre:"Todos · Guztiak"}:
    (()=>{const cs=cfg.courses.filter(c=>ids.includes(c.id));return{es:cs.map(c=>c.name.es).join(", "),eu:cs.map(c=>c.name.eu).join(", "),pre:cs.map(c=>c.name.es).join(", ")};})();
  const g=new Map();
  cfg.courses.forEach(c=>c.events.forEach(e=>{const key=[e.k,e.from,e.to||e.from,e.k==="custom"?JSON.stringify(e.label||{}):""].join("|");
    if(!g.has(key)) g.set(key,{e,ids:[]}); g.get(key).ids.push(c.id);}));
  g.forEach(({e,ids})=>items.push({a:e.from,b:e.to||e.from,es:evLabel(e,"es"),eu:evLabel(e,"eu"),cat:{start:"Inicio",f1:"Exámenes",f2:"Exámenes",fe:"Empresa"}[e.k]||"Evaluación",ids}));
  const per={};
  cfg.days.map(x=>x.d).sort().forEach(d=>{
    const inSpan=c=>d>=cStart(c)&&d<=cEnd(c), off=cfg.courses.filter(c=>noClass(c,d,DM)), missing=cfg.courses.filter(c=>!noClass(c,d,DM)&&inSpan(c));
    const ids=missing.length?off.filter(inSpan).map(c=>c.id):order.slice();
    if(!ids.length) return;
    const x=DM[d], kinds=new Set(off.map(c=>noClass(c,d,DM)));
    const lab=x.label?{es:x.label.es,eu:x.label.eu,cat:"Vacaciones"}:(kinds.size===1&&kinds.has("hol"))?{es:T.es.L.hol,eu:T.eu.L.hol,cat:"Festivo"}:{es:T.es.L.off,eu:T.eu.L.off,cat:"No lectivo"};
    per[d]={ids,lab};
  });
  let run=null; const flush=()=>{if(run) items.push({a:run.a,b:run.b,es:run.lab.es,eu:run.lab.eu,cat:run.lab.cat,ids:run.ids});};
  Object.keys(per).sort().forEach(d=>{const p=per[d];
    let bridge=false;
    if(run&&run.ids.join()===p.ids.join()&&run.lab.es===p.lab.es){let x=addD(run.b,1);bridge=true;while(x<d){if(wd(x)<5){bridge=false;break;}x=addD(x,1);}}
    if(bridge) run.b=d; else {flush(); run={a:d,b:d,ids:p.ids,lab:p.lab};}});
  flush();
  items.sort((x,y)=>x.a<y.a?-1:x.a>y.a?1:0);
  return ical(`Tartanga ${cfg.year} · Egutegi orokorra / Calendario general`,items.map((it,i)=>{const w=who(it.ids);
    return {uid:"all-"+i,a:it.a,b:it.b,s:`[${w.pre}] ${it.es} / ${it.eu}`,desc:`Cursos: ${w.es}\nIkastaroak: ${w.eu}`,cat:it.cat};}));
}
function save(name,text,type){
  try{const blob=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}catch(e){}
}




/* ---------- shell ---------- */
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  document.getElementById("lang-eu").setAttribute("aria-pressed",lang==="eu");
  document.getElementById("lang-es").setAttribute("aria-pressed",lang==="es");
  document.getElementById("yr").textContent=(cfg.year||"").replace("-","–");
  document.getElementById("view-cal").hidden=view!=="cal";
  document.getElementById("copy").hidden=view!=="cal";
  document.getElementById("print").hidden=!(view==="cal"||view==="hours");
  renderCal();

}
const valid=o=>o&&Array.isArray(o.days)&&Array.isArray(o.courses)&&o.courses.every(c=>c&&c.id&&c.name&&Array.isArray(c.events));

document.getElementById("lang-eu").onclick=()=>{lang="eu";lsSet(LSK.lang,lang);render();};
document.getElementById("lang-es").onclick=()=>{lang="es";lsSet(LSK.lang,lang);render();};

document.getElementById("print").onclick=()=>{try{window.print()}catch(e){}};
document.getElementById("copy").onclick=()=>{
  const url=location.href.split("#")[0]+"#"+cur.id, toast=document.getElementById("toast");
  const ok=()=>{toast.textContent=T[lang].copied;setTimeout(()=>toast.textContent="",2500);};
  try{navigator.clipboard.writeText(url).then(ok,()=>{toast.textContent=T[lang].copyfail;});}catch(e){toast.textContent=T[lang].copyfail;}
};
window.addEventListener("hashchange",()=>{view=hashView(location.hash);
  if(view==="cal"){const c=cfg.courses.find(c=>c.id===location.hash.slice(1));if(c)cur=c;} render();});

if(window.STANDALONE){ try{ if(window.self!==window.top) document.documentElement.classList.add("embedded"); }catch(e){ document.documentElement.classList.add("embedded"); } }
const tip=document.getElementById("tip");
function showTip(el){const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.hidden=false;
  const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";tip.style.top=(r.top-tip.offsetHeight-6<4?r.bottom+6:r.top-tip.offsetHeight-6)+"px";}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);else tip.hidden=true;});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);});
document.addEventListener("focusout",()=>tip.hidden=true);
document.addEventListener("scroll",()=>tip.hidden=true,{passive:true});




(async function boot(){
  if(window.STANDALONE){try{const r=await fetch(window.DATA_URL||"calendario.json",{cache:"no-store"});if(r.ok){const o=await r.json();if(valid(o))published=o;}}catch(e){}}
  cfg=clone(published); isDraft=false;

  render();
})();
</script>
